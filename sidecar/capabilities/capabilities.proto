// Worker capabilities served on /dan/capabilities/1.0.0 (one request, one reply,
// uvarint-length-delimited, like libp2p's own identify protocol).
//
// Regenerate: protoc --go_out=. --go_opt=paths=source_relative capabilities/capabilities.proto
syntax = "proto3";

package dan.capabilities.v1;

option go_package = "dan/sidecar/capabilities";

message CapabilityRequest {
  // Empty asks about every model.
  string model_sha256 = 1;
}

enum State {
  STATE_OFFLINE = 0;     // no fresh status from the worker
  STATE_AVAILABLE = 1;
  STATE_RESERVED = 2;
  STATE_LOADING = 3;
  STATE_SERVING = 4;
}

message Capability {
  uint32 protocol_version = 1;          // 1
  string worker_id = 2;
  string runtime_abi = 3;
  repeated string data_protocols = 4;   // "/dan/transport/1.0.0", "/dan/ring/1.0.0"
  string device = 5;
  uint64 total_memory_mib = 6;          // 0 when unknown
  uint64 offered_memory_mib = 7;        // what a planner may use
  uint32 max_context = 8;
  uint32 max_sessions = 9;
  repeated ModelAvailability models = 10;
  State state = 11;
  Assignment assignment = 12;           // set while not AVAILABLE
}

message ModelAvailability {
  string sha256 = 1;
  uint32 layers = 2;
  uint32 hidden = 3;
  repeated Range cached = 4;            // hint only
}

message Range {
  uint32 begin = 1;
  uint32 end = 2;
}

message Assignment {
  string route_id = 1;
  string model_sha256 = 2;
  uint32 begin = 3;
  uint32 end = 4;
}
